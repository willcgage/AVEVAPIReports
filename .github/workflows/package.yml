name: Build package

# Builds the deployable zip on every push to main and on demand, so servers
# never need the .NET SDK. Download it from the run's "Artifacts" section.
# Pushing a tag such as v0.1.0 or v0.1.0-test.1 also publishes a GitHub
# release with the zip attached; tags with a hyphen are marked prerelease.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test and package
        shell: pwsh
        env:
          PIREPORTS_TEST_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: ./deploy/Build-Package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PiReports-package
          path: artifacts/*.zip
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $zip = Get-ChildItem artifacts/*.zip | Select-Object -First 1
          $named = Join-Path artifacts "PiReports-$tag.zip"
          Copy-Item $zip.FullName $named
          $flags = @('--title', $tag, '--generate-notes', '--verify-tag')
          if ($tag -like '*-*') { $flags += '--prerelease' }
          gh release create $tag $named @flags
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }
