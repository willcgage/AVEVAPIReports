name: Build package

# Builds the deployable zip on every push to main and on demand, so servers
# never need the .NET SDK. Download it from the run's "Artifacts" section.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test and package
        shell: pwsh
        env:
          PIREPORTS_TEST_BROWSER: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
        run: ./deploy/Build-Package.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: PiReports-package
          path: artifacts/*.zip
          retention-days: 30
